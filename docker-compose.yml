version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cassie_postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cassie
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/api/database/schemas.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cassie_backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/cassie
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/api:/app/backend/api
    restart: unless-stopped

  frontend:
    build:
      context: ./web_app
      dockerfile: Dockerfile.frontend
    container_name: cassie_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

