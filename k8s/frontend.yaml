apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: cassie-frontend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://localhost:3001" # Browser talks to localhost via port-forward
        ports:
        - containerPort: 3000
        volumeMounts:
        - mountPath: /app/public/workspace 
          name: shared-data
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: cassie-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
