apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassie-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cassie-backend
  template:
    metadata:
      labels:
        app: cassie-backend
    spec:
      containers:
      - name: backend
        image: cassie-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: cassie-secrets
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cassie-secrets
              key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: cassie-backend
spec:
  selector:
    app: cassie-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassie-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cassie-frontend
  template:
    metadata:
      labels:
        app: cassie-frontend
    spec:
      containers:
      - name: frontend
        image: cassie-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://cassie-backend:3001"
---
apiVersion: v1
kind: Service
metadata:
  name: cassie-frontend
spec:
  selector:
    app: cassie-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: LoadBalancer

